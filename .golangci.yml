version: "2"

linters:
  default: none
  enable:
    - unused
    - ineffassign
    - staticcheck
    - gocognit
    - nestif
    - unparam
  settings:
    gocognit:
      min-complexity: 15
    nestif:
      min-complexity: 4
  exclusions:
    paths:
      - ^skills/
    rules:
      - path: _test\.go$
        linters:
          - gocognit
          - nestif
          - unparam

[data-state="error"] .state-normal { display: none !important; } [data-state="error"] .state-error { display: block; }

  <div class="overlay-backdrop" style="justify-content:flex-start;align-items:stretch"><div class="sheet" style="position:relative;left:0;right:auto;width:18rem;border-left:0;border-right:1px solid var(--border)"><div class="sheet-header"><div class="team"><div class="team-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5-10-5z"/></svg></div><div><div class="font-medium">Acme Inc</div><div class="text-xs muted">Enterprise</div></div></div></div><div class="sheet-body" style="padding:.5rem"><div class="sidebar-group"><div class="sidebar-group-label">Platform</div><button class="menu-btn" data-active>Dashboard</button><button class="menu-btn">Analytics</button><button class="menu-btn">Customers</button><button class="menu-btn">Billing</button></div><div class="sidebar-group"><div class="sidebar-group-label">Workspace</div><button class="menu-btn">Settings</button><button class="menu-btn">Members</button><button class="menu-btn">API keys</button></div></div><div class="sheet-footer" style="justify-content:flex-start"><span class="avatar sm">SO</span><span class="text-sm">Simon</span></div></div></div>
</template>

<div class="sim-toast" id="toast"></div>

<script>
/* ------------------------- theme list (injected by sim.mjs; fallback = contract only) ------------------------- */
const SIM_THEMES = /*__THEME_LIST__*/[{ id: "default", title: "shadcn default (neutral)" }];
const html = document.documentElement;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const state = { direction: "A", view: "overview", stateMode: "normal", overlay: "none", theme: "default", dark: false, style: "nova", radius: "default", vp: "1280" };

/* ------------------------- registries ------------------------- */
const VIEWS = $$("template[data-view]").map((t) => ({ id: t.dataset.view, title: t.dataset.title, notes: t.dataset.notes || "", shell: t.dataset.shell || "any", tpl: t }));
const OVERLAYS = $$("template[data-overlay]").map((t) => ({ id: t.dataset.overlay, title: t.dataset.title, tpl: t }));
const shells = $$(".sim-screen:not([data-standalone])");
const standalone = $(".sim-screen[data-standalone]");

/* ------------------------- controls ------------------------- */
const themeSelect = $("#theme-select");
for (const t of SIM_THEMES) { const o = document.createElement("option"); o.value = t.id; o.textContent = t.title || t.id; themeSelect.append(o); }
const viewSelect = $("#view-select");
for (const v of VIEWS) { const o = document.createElement("option"); o.value = v.id; o.textContent = `${v.title}${v.shell === "none" ? " (no shell)" : ""}`; viewSelect.append(o); }
const overlaySelect = $("#overlay-select");
for (const o of OVERLAYS) { const opt = document.createElement("option"); opt.value = o.id; opt.textContent = o.title; overlaySelect.append(opt); }
const dirTabs = $("#dir-tabs");
for (const s of shells) { const b = document.createElement("button"); b.textContent = `${s.dataset.direction} · ${s.dataset.title}`; b.dataset.direction = s.dataset.direction; b.onclick = () => { state.direction = s.dataset.direction; apply(); }; dirTabs.append(b); }

function renderView() {
  const view = VIEWS.find((v) => v.id === state.view) || VIEWS[0];
  const noShell = view.shell === "none";
  for (const s of shells) {
    const active = !noShell && s.dataset.direction === state.direction;
    s.hidden = !active;
    const slot = $(".view-slot", s);
    if (active) { slot.innerHTML = ""; slot.append(view.tpl.content.cloneNode(true)); }
    for (const el of $$(".view-title", s)) el.textContent = view.title;
    for (const n of $$("[data-go]", s)) { const g = (n.dataset.group || n.dataset.go).split(","); if (g.includes(view.id)) n.setAttribute("data-active", ""); else n.removeAttribute("data-active"); }
  }
  standalone.hidden = !noShell;
  if (noShell) { const slot = $(".view-slot", standalone); slot.innerHTML = ""; slot.append(view.tpl.content.cloneNode(true)); }
  $("#frame").dataset.state = state.stateMode;
  for (const b of $$("button", dirTabs)) b.setAttribute("aria-pressed", String(!noShell && b.dataset.direction === state.direction));
  const shell = noShell ? standalone : shells.find((s) => s.dataset.direction === state.direction);
  $("#sim-notes").innerHTML = `<b>${noShell ? "No shell" : `Shell ${state.direction} — ${shell.dataset.title}`} · view "${view.title}"${state.stateMode !== "normal" ? ` · state ${state.stateMode}` : ""}${state.overlay !== "none" ? ` · overlay ${state.overlay}` : ""}.</b> ${view.notes}${!noShell && shell.dataset.notes ? " <i>" + shell.dataset.notes + "</i>" : ""}`;
  renderOverlay();
  renderCharts();
}
function renderOverlay() {
  const root = $("#overlay-root"); root.innerHTML = "";
  const o = OVERLAYS.find((o) => o.id === state.overlay);
  if (o) root.append(o.tpl.content.cloneNode(true));
}
function apply() {
  html.dataset.theme = state.theme; html.classList.toggle("dark", state.dark); html.dataset.style = state.style; html.dataset.radius = state.radius;
  $("#viewport").style.width = state.vp + "px"; $("#mode-btn").textContent = state.dark ? "☀ light" : "☾ dark";
  themeSelect.value = state.theme; $("#style-select").value = state.style; $("#radius-select").value = state.radius; $("#vp-select").value = state.vp;
  viewSelect.value = state.view; $("#state-select").value = state.stateMode; overlaySelect.value = state.overlay;
  try { localStorage.setItem("ui-sim", JSON.stringify(state)); } catch {}
  renderView(); updateCaption();
}
function updateCaption() { const t = SIM_THEMES.find((t) => t.id === state.theme); const v = VIEWS.find((v) => v.id === state.view); $("#caption").textContent = `${state.vp}px · ${v ? v.title : state.view} · ${t ? t.title : state.theme} · ${state.dark ? "dark" : "light"} · style ${state.style} · radius ${state.radius}${state.stateMode !== "normal" ? " · " + state.stateMode : ""}${state.overlay !== "none" ? " · overlay " + state.overlay : ""}`; }
themeSelect.onchange = (e) => { state.theme = e.target.value; apply(); };
viewSelect.onchange = (e) => { state.view = e.target.value; state.overlay = "none"; apply(); };
$("#state-select").onchange = (e) => { state.stateMode = e.target.value; apply(); };
overlaySelect.onchange = (e) => { state.overlay = e.target.value; apply(); };
$("#mode-btn").onclick = () => { state.dark = !state.dark; apply(); };
$("#style-select").onchange = (e) => { state.style = e.target.value; apply(); };
$("#radius-select").onchange = (e) => { state.radius = e.target.value; apply(); };
$("#vp-select").onchange = (e) => { state.vp = e.target.value; apply(); };
// In-page navigation: any element with data-go switches the view; data-overlay opens an overlay; clicking the backdrop closes it.
document.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]"); if (go && $("#frame").contains(go)) { e.preventDefault(); state.view = go.dataset.go; state.overlay = "none"; state.stateMode = "normal"; apply(); return; }
  const ov = e.target.closest("[data-overlay]"); if (ov && $("#frame").contains(ov) && !ov.closest("#overlay-root")) { e.preventDefault(); state.overlay = ov.dataset.overlay; apply(); return; }
  if (e.target.classList.contains("overlay-backdrop")) { state.overlay = "none"; apply(); }
});
$("#copy-btn").onclick = async () => {
  const t = SIM_THEMES.find((t) => t.id === state.theme); const v = VIEWS.find((v) => v.id === state.view); const s = shells.find((s) => s.dataset.direction === state.direction);
  const text = `UI decision (${new Date().toISOString().slice(0, 10)})\nshell: ${state.direction} — ${s.dataset.title}\nview reviewed: ${v.title} (${state.view})\ntheme: ${t ? t.title : state.theme} (${state.theme}) · mode: ${state.dark ? "dark" : "light"}\nstyle: ${state.style} · radius: ${state.radius}\nviewport: ${state.vp}px`;
  try { await navigator.clipboard.writeText(text); toast("Decision copied — paste it back to Claude."); } catch { toast(text, 12000); }
};
function toast(msg, ms = 2200) { const el = $("#toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => (el.style.display = "none"), ms); }
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,select,textarea")) return;
  const ids = SIM_THEMES.map((t) => t.id); const i = ids.indexOf(state.theme); const vids = VIEWS.map((v) => v.id); const vi = vids.indexOf(state.view);
  if (e.key === "d") { state.dark = !state.dark; apply(); }
  else if (e.key === "]") { state.theme = ids[(i + 1) % ids.length]; apply(); }
  else if (e.key === "[") { state.theme = ids[(i - 1 + ids.length) % ids.length]; apply(); }
  else if (e.key === "m") { const v = ["1280", "1024", "820", "390"]; state.vp = v[(v.indexOf(state.vp) + 1) % v.length]; apply(); }
  else if (e.key === "n") { state.view = vids[(vi + 1) % vids.length]; state.overlay = "none"; apply(); }
  else if (e.key === "p") { state.view = vids[(vi - 1 + vids.length) % vids.length]; state.overlay = "none"; apply(); }
  else if (e.key === "k" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); state.overlay = state.overlay === "command" ? "none" : "command"; apply(); }
  else if (e.key === "Escape") { state.overlay = "none"; apply(); }
  else if (/^[1-9]$/.test(e.key) && shells[+e.key - 1]) { state.direction = shells[+e.key - 1].dataset.direction; apply(); }
});

/* ------------------------- charts (SVG, mimics Recharts as styled by shadcn: area/bar/line/donut/radial) ------------------------- */
let seed = 7; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const DATA = (() => { const out = []; let a = 220, b = 150; for (let i = 0; i < 30; i++) { a = Math.max(60, Math.min(480, a + (Math.sin(i / 2.3) * 60 + (rnd() - 0.5) * 90))); b = Math.max(40, Math.min(420, b + (Math.cos(i / 3.1) * 50 + (rnd() - 0.5) * 70))); out.push({ label: `Apr ${i + 1}`, desktop: Math.round(a), mobile: Math.round(b), online: Math.round(a * 4), retail: Math.round(b * 2.2), calls: Math.round(a * 4), errors: Math.round(b / 12) }); } return out; })();
const SHARES = { organic: 42, direct: 23, referral: 15, social: 12, email: 8 };
function renderCharts() {
  for (const el of $$(".chart")) {
    if (el.closest(".sim-screen")?.hidden || el.closest(".state-loading, .state-empty, .state-error")) continue;
    const series = el.dataset.series.split(",").map((s) => { const [key, label, v] = s.split(":"); return { key, label, color: `var(${v})` }; });
    const type = el.dataset.chart; const W = Math.max(240, el.clientWidth || 600), H = Math.max(140, (el.clientHeight || 250) - 28), P = { l: 8, r: 8, t: 10, b: 26 };
    const uid = Math.random().toString(36).slice(2, 7);
    if (type === "donut") {
      const total = series.reduce((s, x) => s + (SHARES[x.key] ?? 10), 0); const cx = 90, cy = H / 2 + 4, r = Math.min(80, H / 2 - 6), ir = r * 0.62; let a0 = -Math.PI / 2; let paths = "";
      series.forEach((s) => { const v = SHARES[s.key] ?? 10; const a1 = a0 + (v / total) * Math.PI * 2; const p = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)]; const [x0, y0] = p(a0, r), [x1, y1] = p(a1, r), [x2, y2] = p(a1, ir), [x3, y3] = p(a0, ir); const large = a1 - a0 > Math.PI ? 1 : 0; paths += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${ir} ${ir} 0 ${large} 0 ${x3} ${y3} Z" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`; a0 = a1; });
      el.innerHTML = `<div class="donut-wrap"><svg viewBox="0 0 180 ${H + 8}" width="180" height="${H + 8}">${paths}<text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-size:22px;font-weight:600;fill:var(--foreground)">248k</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" class="axis-label">sessions</text></svg><div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.label}<span class="muted" style="margin-left:.25rem">${SHARES[s.key] ?? 10}%</span></span>`).join("")}</div></div>`;
      continue;
    }
    if (type === "radial") {
      const val = Number(el.dataset.value || 60); const cx = W / 2, cy = H / 2 + 20, r = Math.min(W / 2 - 10, H / 2 + 10); const a0 = Math.PI, a1 = Math.PI + Math.PI * (val / 100); const p = (ang) => [cx + r * Math.cos(ang), cy + r * Math.sin(ang)]; const [x0, y0] = p(a0), [x1, y1] = p(a1), [xe, ye] = p(2 * Math.PI);
      el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><path d="M ${x0} ${y0} A ${r} ${r} 0 0 1 ${xe} ${ye}" fill="none" stroke="var(--muted)" stroke-width="18" stroke-linecap="round"/><path d="M ${x0} ${y0} A ${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1} ${y1}" fill="none" stroke="${series[0].color}" stroke-width="18" stroke-linecap="round"/><text x="${cx}" y="${cy - 6}" text-anchor="middle" style="font-size:28px;font-weight:600;fill:var(--foreground)">${val}%</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" class="axis-label">${series[0].label}</text></svg>`;
      continue;
    }
    const data = type === "bar" ? DATA.slice(-12) : DATA; const n = data.length;
    const stacked = data.map((d) => { let acc = 0; const row = {}; for (const s of series) { row[s.key] = [acc, acc + d[s.key]]; acc += d[s.key]; } return row; });
    const max = (type === "area" ? Math.max(...stacked.map((r) => r[series[series.length - 1].key][1])) : Math.max(...data.flatMap((d) => series.map((s) => d[s.key])))) * 1.08;
    const x = (i) => P.l + (i * (W - P.l - P.r)) / (n - 1); const y = (v) => H - P.b - (v / max) * (H - P.t - P.b);
    const grid = [0.25, 0.5, 0.75, 1].map((f) => `<line class="grid-line" x1="${P.l}" x2="${W - P.r}" y1="${y(max * f)}" y2="${y(max * f)}"/>`).join("");
    const every = Math.ceil(n / Math.max(3, Math.floor(W / 110)));
    const ticks = data.map((d, i) => (i % every === 0 ? `<text class="axis-label" x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}">${d.label}</text>` : "")).join("");
    let body = "", defs = "";
    if (type === "area") {
      series.forEach((s, si) => { const top = stacked.map((r, i) => [x(i), y(r[s.key][1])]); const bottom = stacked.map((r, i) => [x(i), y(r[s.key][0])]); const path = smooth(top); const area = `${path} L ${bottom[n - 1][0]} ${bottom[n - 1][1]} ${smoothReverse(bottom)} Z`; defs += `<linearGradient id="g-${uid}-${si}" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stop-color="${s.color}" stop-opacity=".8"/><stop offset="95%" stop-color="${s.color}" stop-opacity=".1"/></linearGradient>`; body += `<path d="${area}" fill="url(#g-${uid}-${si})" fill-opacity=".4"/><path d="${path}" fill="none" stroke="${s.color}" stroke-width="2"/>`; });
    } else if (type === "line") {
      series.forEach((s) => { const pts = data.map((d, i) => [x(i), y(d[s.key])]); body += `<path d="${smooth(pts)}" fill="none" stroke="${s.color}" stroke-width="2"/>` + pts.filter((_, i) => i % every === 0).map(([px, py]) => `<circle cx="${px}" cy="${py}" r="3" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`).join(""); });
    } else {
      const slot = (W - P.l - P.r) / n; const bw = slot * 0.72; const gap = bw / series.length;
      data.forEach((d, i) => series.forEach((s, si) => { const h = (d[s.key] / max) * (H - P.t - P.b); body += `<rect x="${P.l + i * slot + (slot - bw) / 2 + si * gap}" y="${H - P.b - h}" width="${Math.max(2, gap - 2)}" height="${h}" rx="3" fill="${s.color}"/>`; }));
    }
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><defs>${defs}</defs>${grid}${body}<line class="cursor-line" y1="${P.t}" y2="${H - P.b}"/>${ticks}</svg><div class="tooltip"></div><div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>`;
    const svg = $("svg", el), tip = $(".tooltip", el), cur = $(".cursor-line", el);
    el.onmousemove = (e) => { const r = svg.getBoundingClientRect(); const i = Math.max(0, Math.min(n - 1, Math.round(((e.clientX - r.left - P.l) / (r.width - P.l - P.r)) * (n - 1)))); const d = data[i]; cur.style.display = "block"; cur.setAttribute("x1", x(i)); cur.setAttribute("x2", x(i)); tip.style.display = "block"; tip.innerHTML = `<div class="label">${d.label}</div>` + series.map((s) => `<div class="row"><span class="dot" style="background:${s.color}"></span><span class="muted">${s.label}</span><span class="v">${d[s.key].toLocaleString()}</span></div>`).join(""); const px = e.clientX - r.left; tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = Math.max(0, e.clientY - r.top - 10) + "px"; };
    el.onmouseleave = () => { tip.style.display = "none"; cur.style.display = "none"; };
  }
}
function smooth(pts) { if (pts.length < 2) return ""; let d = `M ${pts[0][0]} ${pts[0][1]}`; for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2; const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6]; d += ` C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${p2[0]} ${p2[1]}`; } return d; }
function smoothReverse(pts) { const rev = [...pts].reverse(); return smooth(rev).replace(/^M [^C]+/, ""); }

/* ------------------------- boot (URL params override saved state: ?view=customers&state=empty&overlay=dialog&dir=B&theme=nord&dark=1&style=luma&radius=large&vp=390) ------------------------- */
try { Object.assign(state, JSON.parse(localStorage.getItem("ui-sim") || "{}")); } catch {}
const q = new URLSearchParams(location.search);
if (q.get("theme")) state.theme = q.get("theme"); if (q.has("dark")) state.dark = q.get("dark") !== "0"; if (q.get("style")) state.style = q.get("style"); if (q.get("radius")) state.radius = q.get("radius"); if (q.get("vp")) state.vp = q.get("vp"); if (q.get("dir")) state.direction = q.get("dir");
if (q.get("view")) state.view = q.get("view"); if (q.get("state")) state.stateMode = q.get("state"); if (q.get("overlay")) state.overlay = q.get("overlay");
if (q.size) { state.stateMode = q.get("state") || "normal"; state.overlay = q.get("overlay") || "none"; }
if (!SIM_THEMES.some((t) => t.id === state.theme)) state.theme = SIM_THEMES[0].id;
if (!shells.some((s) => s.dataset.direction === state.direction)) state.direction = shells[0].dataset.direction;
if (!VIEWS.some((v) => v.id === state.view)) state.view = VIEWS[0].id;
if (!["normal", "loading", "empty", "error"].includes(state.stateMode)) state.stateMode = "normal";
if (state.overlay !== "none" && !OVERLAYS.some((o) => o.id === state.overlay)) state.overlay = "none";
apply();
let _rt; window.addEventListener("resize", () => { clearTimeout(_rt); _rt = setTimeout(renderCharts, 80); });
</script>
